server {
	# docker-compose maps host 9090 -> 3000, so keep listening on 3000.
	listen 3000;
	server_name _;
	root /usr/share/nginx/html;

	# Redirects (e.g. /projects -> /projects/) use a relative Location,
	# so they work behind the reverse proxy and port mapping.
	absolute_redirect off;

	gzip on;
	gzip_types text/css image/svg+xml;

	location ~ ^/discord/?$ {
		return 307 https://discord.gg/zWf5jUY8UN;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
